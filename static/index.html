<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signalroom</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--ink:#0b0d10;--panel:#13161c;--panel2:#181c24;--line:#262b35;
  --text:#e7e9ee;--dim:#8b93a3;--faint:#5b626f;--amber:#e6b450;--bull:#36d399;--bear:#f76f6f;--flat:#7d8595;}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px}
.serif{font-family:'Instrument Serif',Georgia,serif}
header{border-bottom:1px solid var(--line);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.badge{font-size:10px;letter-spacing:1px;padding:4px 9px;border-radius:4px;border:1px solid var(--bull);color:var(--bull)}
button{font-family:inherit;font-size:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(220px,300px) 1fr}
.left{border-right:1px solid var(--line);min-height:80vh}
.lh{padding:12px 16px;font-size:11px;letter-spacing:1px;color:var(--faint)}
.row{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.row:hover{background:var(--panel2)}
.row.active{background:var(--panel2);border-left:2px solid var(--amber)}
.rtop{display:flex;justify-content:space-between;align-items:baseline}
.sym{font-weight:700;font-size:15px}
.detail{padding:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:20px}
.barline{height:4px;background:var(--line);border-radius:2px;margin:10px 0;position:relative}
.barline .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--faint)}
.barline .fill{position:absolute;height:4px;border-radius:2px}
.gauge{height:6px}.gauge .fill{height:6px}
.k{font-size:10px;color:var(--faint);letter-spacing:.8px}
.pos{color:var(--bull)}.neg{color:var(--bear)}.flat{color:var(--flat)}
.detail-line{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.src{font-size:9.5px;color:var(--faint);margin-top:6px;display:flex;justify-content:space-between}
.rc{background:var(--panel2);border:1px solid rgba(230,180,80,.25);border-radius:8px;padding:16px;margin-top:18px;font-size:13px;line-height:1.6}
.note{font-size:10px;color:var(--faint);margin-top:16px;line-height:1.6}
.center{padding:40px;text-align:center;color:var(--faint)}
</style>
</head>
<body>
<header>
  <div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="serif" style="font-size:30px">Signalroom</span>
      <span class="serif" style="font-style:italic;font-size:18px;color:var(--dim)">/ options edge dashboard</span>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:4px">aggregated public signals · not predictions · not financial advice</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="badge" id="badge">● connecting…</span>
    <button id="refresh">↻ refresh</button>
  </div>
</header>

<div id="app"><div class="center">Loading signals from backend…</div></div>

<script>
const $=s=>document.querySelector(s);
let DATA=[], sel=0;
const C={bull:"var(--bull)",bear:"var(--bear)",flat:"var(--flat)"};
const dirOf=v=>v>12?["LEANS BULLISH",C.bull,"▲"]:v<-12?["LEANS BEARISH",C.bear,"▼"]:["NO CLEAR SIGNAL",C.flat,"–"];
const cls=s=>s>8?"pos":s<-8?"neg":"flat";
const colOf=s=>s>8?C.bull:s<-8?C.bear:C.flat;
const META={congress:["Congressional trades","Senate eFD / QuiverQuant"],
  contracts:["Government contracts","USASpending.gov"],
  news:["News sentiment","Google News RSS"],
  insider:["Insider (Form 4)","SEC EDGAR"]};

function fillStyle(el,score){const c=cls(score),col=c==="pos"?C.bull:c==="neg"?C.bear:C.flat;
  el.style.background=col;el.style.left=score>=0?"50%":(50+score/2)+"%";el.style.width=Math.abs(score)/2+"%";}

function render(){
  if(!DATA.length){$("#app").innerHTML='<div class="center">No data.</div>';return;}
  const t=DATA[sel], [dw,dc,da]=dirOf(t.composite), W=t.weights;
  const price=t.price!=null?("$"+Number(t.price).toFixed(2)):"—";
  const day=t.day!=null?`<span style="color:${t.day>=0?C.bull:C.bear}">${t.day>=0?"▲":"▼"} ${Math.abs(t.day).toFixed(1)}%</span>`:"";
  const iv=t.ivMove!=null?("±"+t.ivMove+"%"):"(no options feed yet)";

  $("#app").innerHTML=`<div class="layout">
    <div class="left">
      <div class="lh">WATCHLIST</div>
      ${DATA.map((tk,i)=>{const[,col]=dirOf(tk.composite);return `
        <div class="row ${i===sel?'active':''}" data-i="${i}">
          <div class="rtop"><span class="sym">${tk.symbol}</span>
            <span style="font-size:11px;color:${col}">${tk.composite.toFixed(0)}</span></div>
          <div style="font-size:10px;color:var(--dim);margin-top:4px">${tk.name}</div>
        </div>`;}).join("")}
    </div>
    <div class="detail">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:flex-start">
        <div><div style="font-size:26px;font-weight:700">${t.symbol}
          <span style="color:var(--dim);font-weight:400;font-size:16px">${t.name}</span></div>
          <div style="font-size:22px;margin-top:4px">${price} ${day}</div></div>
        <div class="panel" style="min-width:230px">
          <div class="k">COMPOSITE SIGNAL (heuristic)</div>
          <div style="font-size:17px;font-weight:700;color:${dc};margin-top:6px">${da} ${dw}</div>
          <div class="barline gauge"><div class="mid"></div><div class="fill" id="gfill"></div></div>
          <div style="font-size:10px;color:var(--faint)">score ${t.composite.toFixed(1)} · range −100…+100</div>
        </div>
      </div>
      <div class="cards">
        ${Object.keys(META).map(k=>{const s=t.signals[k],[lbl,srcn]=META[k],contrib=s.score*W[k];return `
          <div class="panel">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:13px">${lbl}</span>
              <span style="margin-left:auto;font-weight:700" class="${cls(s.score)}">${s.score>0?"+":""}${s.score}</span></div>
            <div class="barline"><div class="mid"></div><div class="fill" data-sk="${k}"></div></div>
            <div class="detail-line">${s.detail}</div>
            <div class="src"><span>src: ${srcn}</span><span>w ${W[k]} → ${contrib>=0?"+":""}${contrib.toFixed(1)}</span></div>
          </div>`;}).join("")}
      </div>
      <div class="rc">
        <span style="color:var(--amber);font-size:12px;letter-spacing:.8px">MARKET REALITY CHECK</span><br>
        Options price in a ~<b style="color:var(--amber)">${iv}</b> 30-day move. The composite is a
        <i>signal-strength</i> heuristic, <b>not</b> a probability of profit — your edge only exists if these signals
        beat that implied move, which only a backtest can confirm.
      </div>
      <div class="note">Live where the source allows it; congressional disclosures lag up to 45 days.
        This tool organizes public information and quantifies risk — it does not predict prices and is not financial advice.</div>
    </div>
  </div>`;

  fillStyle($("#gfill"),t.composite);
  document.querySelectorAll('[data-sk]').forEach(el=>fillStyle(el,t.signals[el.dataset.sk].score));
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=+r.dataset.i;render();});
}

async function load(){
  $("#badge").textContent="● loading…";$("#badge").style.color="var(--amber)";$("#badge").style.borderColor="var(--amber)";
  try{
    const res=await fetch("/signals");           // same origin — no CORS, no proxy
    if(!res.ok) throw new Error("HTTP "+res.status);
    DATA=await res.json();
    $("#badge").textContent="● LIVE";$("#badge").style.color="var(--bull)";$("#badge").style.borderColor="var(--bull)";
    render();
  }catch(e){
    $("#badge").textContent="● backend offline";$("#badge").style.color="var(--bear)";$("#badge").style.borderColor="var(--bear)";
    $("#app").innerHTML=`<div class="center">Couldn't reach the backend (${e.message}).<br>
      Is the server running? Locally: <code>uvicorn main:app --port 8000</code> then open this page from http://localhost:8000</div>`;
  }
}
$("#refresh").onclick=load;
load();
</script>
</body>
</html>
